name: Collect SAP Community posts

on:
  schedule:
    - cron: "10 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sap-digest-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python collect.py
      - name: Save queue
        run: |
          git config user.name "sap-digest-bot"
          git config user.email "sap-digest-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Collect $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

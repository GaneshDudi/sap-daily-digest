name: Daily SAP digest

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 07:00 IST
  workflow_dispatch:
    inputs:
      whatsapp:
        description: "Send to WhatsApp"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sap-digest-data
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      WA_TOKEN: ${{ secrets.WA_TOKEN }}
      WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
      WA_TO: ${{ secrets.WA_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash || npm install -g @anthropic-ai/claude-code
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check Claude login
        run: |
          claude --version
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "Missing secret CLAUDE_CODE_OAUTH_TOKEN"; exit 1; fi

      - name: Research and build today's report
        run: python digest.py --no-whatsapp

      - name: Publish report
        run: |
          git config user.name "sap-digest-bot"
          git config user.email "sap-digest-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Digest $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push

      - name: Wait for GitHub Pages to update
        run: sleep 120

      - name: Send to WhatsApp
        if: github.event_name == 'schedule' || inputs.whatsapp
        run: python digest.py --send-only

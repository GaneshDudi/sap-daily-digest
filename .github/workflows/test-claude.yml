name: Test Claude connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash || npm install -g @anthropic-ai/claude-code
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Ask Claude a test question
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "Missing secret CLAUDE_CODE_OAUTH_TOKEN"; exit 1; fi
          echo "Reply with exactly: Claude is connected to the SAP digest." | claude -p --model haiku --tools "" --no-session-persistence

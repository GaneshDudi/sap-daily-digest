# ─────────────────────────────────────────────────────────────
#  SAP Community Daily Digest — configuration
#  Edit this file on GitHub; changes apply from the next run.
# ─────────────────────────────────────────────────────────────

timezone: Asia/Kolkata

# Who the digest is written for. Claude uses this to judge relevance
# and to write the post drafts in the right voice.
audience: >
  An SAP ABAP technical consultant and live trainer based in Bangalore.
  Teaches experienced ABAP developers (S/4HANA 2023, ABAP Platform 2023,
  Eclipse/ADT, CDS, RAP) and runs a WhatsApp community for SAP developers.
  Wants practical, technically precise insight, not marketing fluff.

# Every item from every feed is collected and listed in the report.
# "technical" = only developer/technical items get a deep read.
# "everything" = every item is eligible for a deep read (uses more of your plan).
scope:
  mode: technical
  focus_areas:
    - ABAP (classic, modern syntax, Clean ABAP, performance)
    - RAP (managed, unmanaged, draft, behavior definitions)
    - CDS views, VDM, annotations, access control
    - S/4HANA development and extensibility (key user, developer, clean core)
    - BTP ABAP Environment / ABAP Cloud / Tier 1-2-3
    - OData V2/V4, Gateway, APIs, Integration Suite
    - Fiori elements / UI5
    - HANA, AMDP, SQL performance
    - Developer tools (ADT, abapGit, ATC, gCTS)
    - SAP AI for developers (Joule for developers, generative AI in ABAP)

feeds:
  - name: SAP Community blog posts
    url: https://community.sap.com/khhcw49343/rss/Community?interaction.style=blog&count=100
    kind: blog
  - name: SAP Community questions
    url: https://community.sap.com/khhcw49343/rss/Community?interaction.style=qanda&count=100
    kind: question
  - name: SAP Community discussions
    url: https://community.sap.com/khhcw49343/rss/Community?interaction.style=forum&count=50
    kind: discussion
  - name: SAP News Center
    url: https://news.sap.com/feed/
    kind: news
  - name: abapGit releases
    url: https://github.com/abapGit/abapGit/releases.atom
    kind: release

# Runs on your Claude Pro subscription, so these are kept modest to leave
# plenty of your daily usage for your own work.
limits:
  max_deep_reads: 30        # posts Claude reads fully each day
  deep_batch_size: 6        # posts read together in one request
  triage_batch_size: 60     # items screened together in one request

models:
  fast: haiku    # screens and reads posts
  deep: sonnet   # writes the final daily analysis

whatsapp:
  template_name: sap_daily_digest
  template_language: en
  graph_api_version: v23.0

report:
  # Leave empty to use https://<github-user>.github.io/<repo-name> automatically
  site_url: ""

# ─────────────────────────────────────────────────────────────
#  SAP job market agent (jobs.py)
# ─────────────────────────────────────────────────────────────
jobs:
  # Used to score how well each job matches you. Edit freely.
  profile: >
    SAP ABAP technical consultant and trainer based in Bangalore. Strong in modern ABAP,
    RAP, CDS, OData, S/4HANA 2023 (ABAP Platform 2023, Eclipse/ADT) and hands-on ECC EHP7
    development, including Indian GST e-invoicing. Prefers Bangalore or remote roles.

  # Keyword searches sent to Adzuna's India job index (one request each).
  adzuna_searches:
    - SAP ABAP
    - ABAP developer
    - SAP ABAP HANA
    - SAP RAP
    - SAP BTP ABAP
    - SAP S/4HANA technical
    - SAP OData Fiori
  max_days_old: 2

  # Job alert emails in your Gmail are read from these senders (last ~30 hours).
  email_senders:
    - naukri.com
    - linkedin.com
    - foundit.in
    - instahyre.com
    - cutshort.io
    - iimjobs.com
    - hirist.tech
    - indeed.com

  # Company careers sites. Added one by one after checking they work.
  # type successfactors: SAP SuccessFactors career sites (RSS search, up to 20 jobs per search)
  # type workday: Workday career sites (host, tenant and site come from the careers URL)
  careers:
    - name: SAP
      type: successfactors
      base_url: https://jobs.sap.com
      keywords: [abap]
    # ── DRAFT, not yet live-tested (see session notes) ──
    - {name: Wipro, type: successfactors, base_url: https://careers.wipro.com, keywords: [abap]}
    - {name: HCLTech, type: successfactors, base_url: https://careers.hcltech.com, keywords: [abap]}
    - {name: EY, type: successfactors, base_url: https://careers.ey.com, keywords: [abap]}
    - {name: Deloitte India, type: successfactors, base_url: https://southasiacareers.deloitte.com, keywords: [abap]}
    - {name: NTT DATA, type: successfactors, base_url: https://careers-inc.nttdata.com, keywords: [abap]}
    - {name: Accenture, type: workday, host: accenture.wd103.myworkdayjobs.com, tenant: accenture, site: AccentureCareers, keywords: [SAP ABAP]}
    - {name: PwC, type: workday, host: pwc.wd3.myworkdayjobs.com, tenant: pwc, site: Global_Experienced_Careers, keywords: [SAP ABAP]}
    - {name: Shell, type: workday, host: shell.wd3.myworkdayjobs.com, tenant: shell, site: ShellCareers, keywords: [SAP ABAP]}
    - {name: 3M, type: workday, host: 3m.wd1.myworkdayjobs.com, tenant: 3m, site: Search, keywords: [SAP ABAP]}
    - {name: ZEISS, type: workday, host: zeissgroup.wd3.myworkdayjobs.com, tenant: zeissgroup, site: External, keywords: [SAP ABAP]}
    - {name: Mitel, type: workday, host: mitel.wd3.myworkdayjobs.com, tenant: mitel, site: mitelcareers, keywords: [SAP ABAP]}
    - {name: Momentive, type: workday, host: momentive.wd1.myworkdayjobs.com, tenant: momentive, site: MC, keywords: [SAP ABAP]}
    - {name: Dentsu, type: workday, host: dentsuaegis.wd3.myworkdayjobs.com, tenant: dentsuaegis, site: DAN_GLOBAL, keywords: [SAP ABAP]}

  # Posts Claude analyses in detail per run (keeps your Pro usage modest).
  max_jobs_analysed: 150
  analysis_batch_size: 40
